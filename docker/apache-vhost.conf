# Dropzone Apache vhost. DocumentRoot is public/ only.
<VirtualHost *:80>
    DocumentRoot /var/www/public
    ServerName localhost

    <Directory /var/www>
        Require all denied
    </Directory>

    <Directory /var/www/public>
        Options -Indexes +FollowSymLinks
        AllowOverride All
        Require all granted
    </Directory>

    <Directory /var/www/storage>
        Require all denied
    </Directory>

    <Directory /var/www/public/storage>
        Options -Indexes
        php_admin_flag engine off
        <FilesMatch "\.(php|phtml|phar)$">
            Require all denied
        </FilesMatch>
    </Directory>

    ErrorLog ${APACHE_LOG_DIR}/dropzone-error.log
    CustomLog ${APACHE_LOG_DIR}/dropzone-access.log combined
</VirtualHost>
