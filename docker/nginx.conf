# Dropzone nginx snippet. Document root MUST be .../public
# Files in storage/app/uploads are outside the web root and only
# downloadable through /d/{uuid}/download.

server {
    listen 80;
    server_name _;
    root /var/www/public;
    index index.php;

    autoindex off;
    server_tokens off;

    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "DENY" always;
    add_header Referrer-Policy "no-referrer" always;

    location ^~ /admin {
        add_header X-Robots-Tag "noindex, nofollow, noarchive" always;
        try_files $uri $uri/ /index.php?$query_string;
    }

    location ^~ /d/ {
        add_header X-Robots-Tag "noindex, nofollow, noarchive" always;
        try_files $uri $uri/ /index.php?$query_string;
    }

    location ^~ /storage/uploads {
        deny all;
        return 403;
    }

    location ^~ /storage/app {
        deny all;
        return 403;
    }

    location ~ /\. {
        deny all;
    }

    location ~* /storage/.*\.(php|phtml|phar)$ {
        deny all;
    }

    location / {
        try_files $uri $uri/ /index.php?$query_string;
    }

    location = /index.php {
        include fastcgi_params;
        fastcgi_param SCRIPT_FILENAME $realpath_root$fastcgi_script_name;
        fastcgi_pass unix:/run/php/php8.2-fpm.sock;
        internal;
    }

    location ~ \.php$ {
        deny all;
    }

    location ~* \.(engine|inc|sql|bak|config|dist|fla|ini|log|psd|sh|tar|tgz)$ {
        deny all;
    }
}
